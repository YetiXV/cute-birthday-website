
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Te amoooo 💕</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="blur-in-start">

  <div id="floating-bg"></div>

  <!-- Navegación -->
  <nav class="page-nav">
    <a href="index.html"></a>
    <a href="gallery.html" class="active"></a>
    <a href="reasons.html"></a>
    <a href="letter.html"></a>
  </nav>

  <section id="gallery" class="page">

    <h2 class="gallery-heading">
      Nuestros pequeños momentos
      <span class="heart">🩷</span>
    </h2>

    <p class="gallery-sub">
      Desliza o utiliza las flechitas para descubrir
      recuerdos juntos
    </p>

    <div class="slideshow-wrap">

      <!-- GIF decorativo 1 -->
      <div class="corner-deco">
        <img
          src="assets/sparkle1.gif"
          alt="Decoración romántica"
        >
      </div>

      <div class="slide-stage">

        <button
          class="arrow-btn"
          id="prevBtn"
          aria-label="Foto anterior"
        >‹</button>

        <div class="photo-stage" id="photoStage">

          <div class="polaroid" id="polaroid">
            <div class="photo-frame">

              <img
                id="currentPhoto"
                src="photos/photo1.jpg"
                alt="Nuestro primer recuerdo"
              >

            </div>
          </div>

          <!-- GIF decorativo 2 -->
          <div class="bottom-left-deco">
            <img
              src="assets/sparkle2.gif"
              alt="Decoración de corazones"
            >
          </div>

        </div>

        <button
          class="arrow-btn"
          id="nextBtn"
          aria-label="Foto siguiente"
        >›</button>

      </div>

      <p class="caption" id="currentCaption">
        Gracias por llenar mi vida de momentos tan bonitos, mi amor.
      </p>

      <div class="dots" id="dots">
        <button class="dot active" data-index="0" aria-label="Foto 1"></button>
        <button class="dot" data-index="1" aria-label="Foto 2"></button>
        <button class="dot" data-index="2" aria-label="Foto 3"></button>
        <button class="dot" data-index="3" aria-label="Foto 4"></button>
      </div>

      <p class="counter" id="counter">
        Foto 1 de 4
      </p>

    </div>

    <div class="page-buttons">
      <a href="index.html" class="nav-btn secondary">
        &lt; Volver
      </a>

      <a href="reasons.html" class="nav-btn">
        Descubre cuánto te amo ❤️
      </a>
    </div>

  </section>

  <script src="js/script.js?v=3"></script>
  <script src="js/gallery.js?v=3"></script>

</body>
</html>
